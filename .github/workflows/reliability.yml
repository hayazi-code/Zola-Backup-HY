name: ZoLa reliability checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check layer-explorer.js
          node --check mobile.js
          node --check gis-network.js
          node --check tests/network.test.cjs
      - name: Run offline regression tests
        run: node --test tests/network.test.cjs
      - name: Verify static page references
        run: |
          node -e "const f=require('fs'); const s=f.readFileSync('index.html','utf8'); for(const name of ['app.js','layer-explorer.js','mobile.js','gis-network.js','styles.css']){if(!s.includes(name))process.exitCode=1}"
