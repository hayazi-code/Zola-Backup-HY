name: Brooklyn 10 BBL profile deck build
on:
  push:
    branches:
      - chore/bbl-profile-build-20261104

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check requests pillow python-pptx
      - name: Build ten exact-lot slide profiles
        run: python tools/bbl-profiles/build_10.py
      - name: Upload finished PowerPoint and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brooklyn-10-property-profile-deck
          path: output/
          if-no-files-found: warn
          retention-days: 7
